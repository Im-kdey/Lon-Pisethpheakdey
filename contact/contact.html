<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Send Message</title>
    <link rel="stylesheet" href="contact.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">
</head>
<body>
    <div class="container">
        <div class="form">
            <div class="title">
                <h2>let's talk togather</h2>
                <p>Have a project or an opportunity? I'd love to hear from you.</p>
            </div>
            <div class="cart">
                <div class="card">
                    <i class="bi bi-envelope"></i>
                    <p>Email</p>
                    <a href="mailto:">lonpisethpheakdey855@gmail.com</a>
                </div>
                <div class="card">
                    <i class="bi bi-geo-alt"></i>
                    <p>Location</p>
                    <a href="https://www.google.com/maps/place/AH11,+Phnom+Penh/@11.5626655,104.8552535,19z/data=!3m1!4b1!4m6!3m5!1s0x310951db5cd18f47:0x8593c6f8dcdd96a2!8m2!3d11.5626642!4d104.8558972!16s%2Fg%2F11g64x_scz?entry=ttu&g_ep=EgoyMDI2MTExNy4wIKXMDSoASAFQAw%3D%3D">Phnom Penh, Cambodia</a>
                </div>
            </div>
            <div class="message">
                <h3>Send Message To Me</h3>
                <div class="input-group">
                    <label for="">Name</label>
                    <input type="text" placeholder="Your Name">
                    <label for="">Your Email</label>
                    <input type="email" name="" id="" placeholder="Your Email">
                    <label for="">Subject</label>
                    <input type="text" placeholder="What is this about?">
                    <label for="">Message</label>
                    <input type="text" name="" id="ms" placeholder="Write your message here...">
                    <button type="submit">Send Message <i class="bi bi-send"></i></button>

                </div>
            </div>
        </div>
    </div>
    
</body>
</html>
